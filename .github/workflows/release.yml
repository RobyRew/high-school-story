name: Build and release

# Builds the modded APK from the original attached to the `source-apk` release,
# signs it with the permanent key from the repo secrets, and publishes a release
# with both APKs. The release tag is the mod version (VERSION_PATCH in
# patcher/patch_apk.py), e.g. 1.0.4.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (off = build artifact only)
        type: boolean
        default: true
      overwrite:
        description: Replace the files of a release that already exists for this version
        type: boolean
        default: false
  push:
    tags:
      - "1.0.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile the patcher
        run: python3 -m py_compile patcher/*.py

      - name: Read versions
        id: v
        working-directory: patcher
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import patch_apk as p
          print(f"mod={p.VERSION_NAME}")
          print(f"game={p.GAME_VERSION}")
          print(f"apk={p.APK_NAME}")
          print(f"original={p.ORIGINAL_NAME}")
          PY

      - name: Check the tag matches the patcher version
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.v.outputs.mod }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} but patcher/patch_apk.py says ${{ steps.v.outputs.mod }}. Bump VERSION_PATCH or retag."
            exit 1
          fi

      - name: Download the original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          if ! gh release download source-apk -p '*.apk' -D input --clobber; then
            echo "::error::Attach the original High School Story ${{ steps.v.outputs.game }} APK to a release tagged source-apk."
            exit 1
          fi
          ls -la input
          if [ "$(ls input/*.apk | wc -l)" -ne 1 ]; then
            echo "::error::The source-apk release must hold exactly one APK."
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD repo secrets. Builds are never signed with a throwaway key."
            exit 1
          fi
          mkdir -p build
          printf '%s' "$KEYSTORE_B64" | base64 -d > build/offline.keystore

      - name: Patch and sign
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: python3 patcher/patch_apk.py --apk input/*.apk

      - name: Check the build is a release build
        run: |
          if grep -q 'android:debuggable="true"' build/decoded/AndroidManifest.xml; then
            echo "::error::The manifest is debuggable. Release builds never pass --debuggable."
            exit 1
          fi

      - name: Read the release notes from CHANGELOG.md
        env:
          MOD: ${{ steps.v.outputs.mod }}
        run: |
          awk -v v="## $MOD" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > changelog-section.md
          if ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "::error::CHANGELOG.md has no '## $MOD' section."
            exit 1
          fi

      - name: Stage the release files
        run: |
          mkdir -p out
          cp "dist/${{ steps.v.outputs.apk }}" out/
          cp input/*.apk "out/${{ steps.v.outputs.original }}"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: high-school-story-${{ steps.v.outputs.mod }}
          path: out/*
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.mod }}
          GAME: ${{ steps.v.outputs.game }}
          APK: ${{ steps.v.outputs.apk }}
          ORIGINAL: ${{ steps.v.outputs.original }}
        run: |
          {
            echo "## High School Story ${GAME} · RR Mod ${TAG}"
            echo
            cat changelog-section.md
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`${APK}\` | the mod |"
            echo "| \`${ORIGINAL}\` | Pixelberry's untouched ${GAME} client |"
            echo "| \`SHA256SUMS.txt\` | checksums of both |"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.overwrite }}" != "true" ]; then
              echo "::error::Release $TAG already exists. Bump VERSION_PATCH, or rerun with overwrite to replace its files."
              exit 1
            fi
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "${{ github.sha }}" --title "High School Story ${GAME} · RR Mod ${TAG}" --notes-file notes.md
          fi
